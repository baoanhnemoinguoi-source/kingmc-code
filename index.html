<script>
    // 1. Danh sách 15 mã code ngẫu nhiên
    const codeList = {
        "1": "KMC-892X7A",
        "2": "KMC-314P9B",
        "3": "KMC-750M2C",
        "4": "KMC-189K6D",
        "5": "KMC-623L4E",
        "6": "KMC-941R8F",
        "7": "KMC-507T3G",
        "8": "KMC-238V1H",
        "9": "KMC-865W5J",
        "10": "KMC-412Z0K",
        "11": "KMC-976Y4L",
        "12": "KMC-351U8M",
        "13": "KMC-684N2P",
        "14": "KMC-129Q7R",
        "15": "KMC-543X9T"
    };

    // 2. Hàm quét tìm số thứ tự thông minh từ mọi kiểu URL
    function getCodeId() {
        const fullUrl = window.location.href;
        
        // Tìm tham số ?v=1 hoặc ?id=1
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('v')) return urlParams.get('v').trim();
        if (urlParams.get('id')) return urlParams.get('id').trim();

        // Tìm dạng hashtag #1
        if (window.location.hash) {
            const hashNum = window.location.hash.replace(/[^0-9]/g, '');
            if (hashNum) return hashNum;
        }

        // Tự động quét tìm con số bất kỳ ở cuối URL
        const matches = fullUrl.match(/[\/#?&]v?=?(\d+)\/?$/);
        if (matches && matches[1]) {
            return matches[1];
        }

        return null;
    }

    // 3. Hiển thị mã
    const id = getCodeId();
    const displayElement = document.getElementById('code-display');

    if (id && codeList[id]) {
        displayElement.innerText = codeList[id];
        displayElement.style.color = '#4ade80'; // Màu xanh lá khi thành công
    } else {
        displayElement.innerText = "MÃ KHÔNG HỢP LỆ!";
        displayElement.style.color = '#f87171'; // Màu đỏ khi lỗi
    }

    function copyCode() {
        const text = displayElement.innerText;
        if (text && !text.includes("KHÔNG HỢP LỆ")) {
            navigator.clipboard.writeText(text);
            alert("Đã sao chép mã: " + text);
        }
    }
</script>

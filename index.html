<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác Nhận Mã Code KingMC</title>
    <style>
        body { font-family: sans-serif; background: #1a1a1a; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: #2d2d2d; padding: 30px; border-radius: 12px; text-align: center; max-width: 400px; width: 90%; border: 1px solid #444; }
        h2 { color: #2ecc71; margin-top: 0; }
        .code-box { background: #111; border: 2px dashed #f1c40f; border-radius: 8px; padding: 15px; margin: 20px 0; }
        .code-text { color: #f1c40f; font-size: 26px; font-weight: bold; margin: 0; }
        p { color: #aaa; font-size: 14px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🎉 VƯỢT LINK THÀNH CÔNG!</h2>
        <p>Mã Code nhận KingMC của bạn là:</p>
        <div class="code-box">
            <h1 id="kingmc-code-display" class="code-text">Đang lấy mã...</h1>
        </div>
        <p>Copy mã trên, quay lại Discord gõ:<br><b style="color:#00bcff;">/nhapcode code: [Mã của bạn]</b></p>
    </div>

    <script>
        function getKingMCCode() {
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');
            const displayElement = document.getElementById('kingmc-code-display');
            if (code) {
                displayElement.innerText = code;
            } else {
                displayElement.innerText = "❌ LỖI: KHÔNG THẤY MÃ";
                displayElement.style.color = "#e74c3c";
            }
        }
        window.onload = getKingMCCode;
    </script>
</body>
</html>
